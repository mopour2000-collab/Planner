<script>
const $=s=>document.querySelector(s),fa=(n,o)=>(+n).toLocaleString('fa-IR',Object.assign({useGrouping:false},o||{}));
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;const g2=gm>2?gy+1:gy;let days=365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)-80+gd+g[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sa=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;for(;gm<13&&gd>sa[gm];gm++)gd-=sa[gm];return[gy,gm,gd]}
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'],TT={w:'اهداف هفتگی',m:'اهداف ماهانه',y:'اهداف سالانه'};
const noon=(y,m,d)=>new Date(y,m-1,d,12),ks=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const da=(d,n)=>{const e=new Date(d);e.setDate(e.getDate()+n);return e};
const J=d=>g2j(d.getFullYear(),d.getMonth()+1,d.getDate()),wd=d=>(d.getDay()+1)%7,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const SC={d:'روزانه',w:'هفتگی',m:'ماهانه',y:'سالانه'};

try{const r=JSON.parse(localStorage.getItem('dp2'));if(Array.isArray(r))S=r;else{const o=JSON.parse(localStorage.getItem('dp1'));if(Array.isArray(o))S=o.map(x=>({id:x.id,p:null,c:'d',k:x.d,t:x.t,done:x.done,q:x.q,n:x.n||'',x:0}))}}catch(e){}

const stt=d=>da(d,-wd(d)),ms=d=>da(d,-(J(d)[2]-1)),ys=d=>{const[,m,j]=J(d);return da(d,-((m<=6?(m-1)*31:186+(m-7)*30)+j-1))};
const key=(c,A)=>c==='d'?ks(A):c==='w'?ks(stt(A)):c==='m'?J(A).slice(0,2).join('-'):''+J(A)[0];

const isL=x=>!S.some(c=>c.p===x.id);const stat=a=>{a=a.filter(isL);const q=a.filter(x=>x.q),d=a.filter(x=>x.done).length;return{t:a.length,d,r:[1,2,3,4,5].map(i=>a.filter(x=>x.q===i).length),p:a.length?d/a.length:0,q:q.length?q.reduce((s,x)=>s+x.q,0)/q.length:0}};

const DN=(p,z)=>{const r=z/2-6,c=2*Math.PI*r,m=z/2;return`<svg viewBox="0 0 ${z} ${z}" width="${z}" height="${z}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--ln)" stroke-width="7"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--tc)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${p*c} ${c}" transform="rotate(-90 ${m} ${m})"/><text x="${m}" y="${m+6}" text-anchor="middle">${fa(Math.round(p*100))}٪</text></svg>`};
